spring:
  datasource:
    url: jdbc:h2:file:./.data/cartpilot-ai;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  flyway:
    locations: classpath:db/migration/common,classpath:db/migration/local-lite
  ai:
    model:
      chat: google-genai
    retry:
      max-attempts: 2
      backoff:
        initial-interval: 1s
        multiplier: 2
        max-interval: 2s
    google:
      genai:
        api-key: ${GOOGLE_API_KEY}
        chat:
          model: gemini-3.5-flash-lite

cartpilot:
  ai:
    google:
      timeout: 15s
      retry-attempts: 1
